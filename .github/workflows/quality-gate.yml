name: Quality gate

on:
  pull_request:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, tests and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El mismo comando que el hook pre-push (tipos, lint y tests).
      # No renombrar el job: el ruleset exige el check por su nombre exacto.
      - name: Gate (el mismo que el pre-push)
        run: npm run gate
